      - "Adafruit BME280 Library (2.3.0)"
      - "Adafruit Unified Sensor (1.1.15)"
      - "Adafruit BusIO (1.17.1)"
      - "Adafruit GFX Library (1.12.1)"
      - "Adafruit SSD1306 (2.5.14)"
